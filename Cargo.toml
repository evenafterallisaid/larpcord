[package]
name = "larpcord"
default-run = "larpcord"
version = "0.2.0-dev.6"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A small, native Discord client in Rust and GPUI"
repository = "https://github.com/evenafterallisaid/larpcord"

[features]
media-stress = []

[[bin]]
name = "media-stress"
path = "tools/media-stress.rs"
required-features = ["media-stress"]

[dependencies]
alhazen-gpui = { version = "=0.7.2", default-features = false, features = ["native", "http", "audio-output", "videotoolbox", "media-foundation", "nvdec", "vaapi", "native-aac"] }
base64 = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }
rsa = "0.9"
sha2 = "0.10"
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
directories = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
notify-rust = "4"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1"
zeroize = "1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# gpui's old xattr needs the linux enodata name with current libc.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
gpui = { path = "vendor/gpui" }
